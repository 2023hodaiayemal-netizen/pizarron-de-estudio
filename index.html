<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizarrón de estudio · Órbita de Ideas</title><link rel="stylesheet" href="style.css"></head><body><header class="cabecera"><div><p>ÓRBITA DE IDEAS</p><h1>Pizarrón de estudio</h1></div><p>Notas y conversiones en un mismo lugar.</p></header><main class="tablero">
<section class="panel notas-panel" aria-labelledby="titulo-notas"><h2 id="titulo-notas">Notas del grupo</h2><form id="form-nota"><label for="nota-texto">Nueva nota<textarea id="nota-texto" rows="3" placeholder="¿Qué necesitamos recordar?"></textarea></label><label for="nota-categoria">Categoría<select id="nota-categoria"><option>Repasos</option><option>Dudas</option><option>Cálculos</option></select></label><button type="submit">Guardar nota</button></form><div class="filtro"><label for="filtro-categoria">Mostrar<select id="filtro-categoria"><option value="Todas">Todas</option><option>Repasos</option><option>Dudas</option><option>Cálculos</option></select></label></div><p id="mensaje-notas" role="status"></p><div id="lista-notas" class="lista-notas"></div></section>
<section class="panel conversor" aria-labelledby="titulo-conversor"><h2 id="titulo-conversor">Conversor de unidades</h2><label for="tipo-conversion">Tipo<select id="tipo-conversion"><option value="length">Longitud</option><option value="mass">Masa</option><option value="temperature">Temperatura</option></select></label><label for="valor-conversion">Valor<input id="valor-conversion" type="number" step="any" inputmode="decimal"></label><div class="unidades"><label for="unidad-origen">Desde<select id="unidad-origen"></select></label><label for="unidad-destino">Hacia<select id="unidad-destino"></select></label></div><button type="button" id="convertir">Convertir</button><div class="resultado"><span>Resultado</span><output id="resultado-conversion" aria-live="polite">—</output><p id="mensaje-conversion" role="alert"></p></div><button type="button" id="guardar-conversion" disabled>Guardar como nota</button></section>
</main><script src="script.js"></script></body></html>
